<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare Garage - AI Voice Assistant</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #dddddd;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #eb6a0a 0%, #ff914d 30%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #667eea;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .processing-indicator {
            display: inline-block;
            color: #999;
            font-style: italic;
            font-size: 13px;
        }

        .status-indicator {
            text-align: center;
            padding: 10px;
            font-size: 13px;
            color: #666;
            font-style: italic;
        }

        .status-indicator.listening {
            color: #e74c3c;
            font-weight: bold;
        }

        .controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-hangup {
            background: linear-gradient(135deg, #c33764 0%, #1d2671 100%);
            color: white;
        }

        .session-info {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            margin: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #155724;
        }

        .session-info strong {
            display: block;
            margin-bottom: 5px;
            color: #0f4220;
        }

        .session-info.confirmed {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span style="display: flex; align-items: center; justify-content: space-between;">
                <img src="https://www.ntt24.de/images/ntt_logo/ntt_.png" alt="NTT24 Logo"
                    style="height: 45px; vertical-align: middle; margin-right: 10px;">
                <h1>Appointment Booking Bot</h1>
            </span>
            <p style="text-align: right;">AI Voice Assistant</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="status-indicator">Click "Start Call" to begin</div>
        </div>

        <div id="sessionInfo" class="session-info" style="display: none;">
            <strong>Appointment Details:</strong>
            <div id="sessionDetails"></div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="startCall()">
                📞 Start Call
            </button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopListening()" style="display: none;" disabled>
                🎤 Stop Speaking
            </button>
            <button class="btn btn-hangup" id="hangupBtn" onclick="hangupCall()" style="display: none;">
                📵 Hang Up
            </button>
        </div>
    </div>

    <script>
        let socket;
        let mediaRecorder;
        let audioChunks = [];
        let isCallActive = false;
        let isRecording = false;
        let currentTypingTimeout = null;
        let stopAllActivity = false;
        let currentUserMessageElement = null;
        let voicesLoaded = false;
        let availableVoices = [];

        // iOS-specific: Initialize voices on page load
        function initVoices() {
            return new Promise((resolve) => {
                availableVoices = speechSynthesis.getVoices();
                
                if (availableVoices.length > 0) {
                    voicesLoaded = true;
                    console.log('✓ Voices loaded:', availableVoices.length);
                    resolve();
                } else {
                    // iOS requires this event listener
                    speechSynthesis.addEventListener('voiceschanged', () => {
                        availableVoices = speechSynthesis.getVoices();
                        voicesLoaded = true;
                        console.log('✓ Voices loaded (delayed):', availableVoices.length);
                        resolve();
                    }, { once: true });
                    
                    // Fallback timeout for iOS
                    setTimeout(() => {
                        availableVoices = speechSynthesis.getVoices();
                        voicesLoaded = true;
                        resolve();
                    }, 1000);
                }
            });
        }

        // Initialize voices when page loads
        window.addEventListener('load', () => {
            initVoices();
        });

        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                console.log('✓ Connected to server');
            });

            socket.on('transcription-complete', (data) => {
                if (currentUserMessageElement) {
                    const bubble = currentUserMessageElement.querySelector('.message-bubble');
                    bubble.textContent = '';
                    animateTextChunks(bubble, data.text, 5, 15);
                } else {
                    addMessageInstant(data.text, 'user');
                }
                currentUserMessageElement = null;
                stopListening();
            });

            socket.on('assistant-message', async (data) => {
                const messageElement = createStreamingMessage(data.text, 'assistant');

                const typewriterPromise = typewriterEffect(messageElement, data.text);
                const ttsPromise = speakText(data.text);

                await Promise.all([typewriterPromise, ttsPromise]);

                if (data.sessionData) {
                    updateSessionInfo(data.sessionData);
                }

                if (data.shouldEnd && data.isConfirmed) {
                    console.log('🎉 Appointment confirmed! Ending call...');
                    addStatus('✅ Appointment booked successfully!');
                    setTimeout(() => {
                        hangupCall();
                    }, 2000);
                } else if (data.shouldEnd) {
                    addStatus('Call ending...');
                    setTimeout(() => hangupCall(), 2000);
                } else {
                    setTimeout(() => startListening(), 500);
                }
            });

            socket.on('conversation-ended', () => {
                addStatus('Call ended');
                resetUI();
            });

            socket.on('error', (error) => {
                console.error('Socket error:', error);
                addStatus('Error: ' + error.message);
            });
        }

        async function startCall() {
            try {
                stopAllActivity = false;
                
                // iOS: Ensure voices are loaded before starting
                if (!voicesLoaded) {
                    await initVoices();
                }
                
                // iOS: Prime the speech synthesis with user interaction
                const utterance = new SpeechSynthesisUtterance('');
                speechSynthesis.speak(utterance);
                speechSynthesis.cancel();
                
                initSocket();
                isCallActive = true;

                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('hangupBtn').style.display = 'flex';

                addStatus('Connecting to assistant...');

                socket.emit('start-conversation', {});

            } catch (error) {
                console.error('Error starting call:', error);
                addStatus('Failed to start call');
            }
        }

        async function startListening() {
            if (!isCallActive || isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const options = {
                    mimeType: 'audio/webm;codecs=opus',
                    audioBitsPerSecond: 128000
                };

                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'audio/webm';
                }

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];
                currentUserMessageElement = createPlaceholderMessage('user');

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();

                    reader.onloadend = () => {
                        const base64Audio = reader.result.split(',')[1];
                        socket.emit('voice-input', base64Audio);
                    };

                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                document.getElementById('stopBtn').style.display = 'flex';
                document.getElementById('stopBtn').disabled = false;

                if (currentUserMessageElement) {
                    const bubble = currentUserMessageElement.querySelector('.message-bubble');
                    bubble.innerHTML = '<span class="processing-indicator">🎤 Recording...</span>';
                }

                setTimeout(() => {
                    if (isRecording) stopListening();
                }, 5000);

            } catch (error) {
                console.error('Microphone error:', error);
                addStatus('Could not access microphone');
                currentUserMessageElement = null;
            }
        }

        function stopListening() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('stopBtn').style.display = 'none';
            }
        }

        function createPlaceholderMessage(sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return messageDiv;
        }

        function animateTextChunks(element, text, chunkSize = 5, delay = 15) {
            return new Promise((resolve) => {
                let index = 0;
                element.textContent = '';

                function displayNextChunk() {
                    if (stopAllActivity || index >= text.length) {
                        return resolve();
                    }

                    const chunk = text.substring(index, index + chunkSize);
                    element.textContent += chunk;
                    index += chunkSize;

                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    if (index < text.length) {
                        setTimeout(displayNextChunk, delay);
                    } else {
                        resolve();
                    }
                }

                displayNextChunk();
            });
        }

        function addMessageInstant(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);

            if (text.length < 20) {
                bubbleDiv.textContent = text;
            } else {
                animateTextChunks(bubbleDiv, text, 5, 15);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function createStreamingMessage(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = '<span class="typing-cursor"></span>';

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return bubbleDiv;
        }

        function typewriterEffect(element, text, speed = 50) {
            return new Promise((resolve) => {
                let index = 0;
                element.innerHTML = '<span class="typing-cursor"></span>';

                function typeNextChar() {
                    if (stopAllActivity) {
                        const cursor = element.querySelector('.typing-cursor');
                        if (cursor) cursor.remove();
                        return resolve();
                    }

                    if (index < text.length) {
                        const cursor = element.querySelector('.typing-cursor');
                        if (cursor) cursor.remove();

                        element.textContent += text.charAt(index);
                        index++;

                        element.innerHTML += '<span class="typing-cursor"></span>';

                        const chatContainer = document.getElementById('chatContainer');
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        currentTypingTimeout = setTimeout(typeNextChar, speed);
                    } else {
                        const cursor = element.querySelector('.typing-cursor');
                        if (cursor) cursor.remove();
                        resolve();
                    }
                }

                typeNextChar();
            });
        }

        function speakText(text) {
            return new Promise((resolve) => {
                // iOS: Cancel any existing speech
                speechSynthesis.cancel();
                
                // iOS: Small delay to ensure cancel completes
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.95;
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;

                    // iOS: Use already loaded voices
                    if (availableVoices.length === 0) {
                        availableVoices = speechSynthesis.getVoices();
                    }
                    
                    selectVoice(utterance, availableVoices);
                    
                    console.log('🔊 Speaking with voice:', utterance.voice ? utterance.voice.name : 'default');

                    // iOS: Handle speech events
                    utterance.onstart = () => {
                        console.log('🔊 Speech started');
                    };

                    utterance.onend = () => {
                        console.log('✓ Speech ended');
                        resolve();
                    };

                    utterance.onerror = (error) => {
                        console.error('TTS error:', error);
                        // iOS: Retry once on error
                        if (error.error === 'interrupted' || error.error === 'cancelled') {
                            setTimeout(() => {
                                speechSynthesis.speak(utterance);
                            }, 100);
                        } else {
                            resolve();
                        }
                    };

                    // iOS: Speak the utterance
                    speechSynthesis.speak(utterance);
                    
                    // iOS: Fallback timeout (30 seconds max)
                    setTimeout(() => {
                        if (speechSynthesis.speaking) {
                            speechSynthesis.cancel();
                        }
                        resolve();
                    }, 30000);
                }, 100);
            });
        }

        function selectVoice(utterance, voices) {
            if (!voices || voices.length === 0) {
                console.warn('⚠️ No voices available, using default');
                return;
            }

            // iOS-specific voice names
            const iosVoices = [
                'Samantha',
                'Karen',
                'Victoria',
                'Susan',
                'Moira'
            ];

            // Android/Chrome voice names
            const androidVoices = [
                'Google US English',
                'Microsoft Zira',
                'English United States'
            ];

            // Combined list
            const preferredNames = [...iosVoices, ...androidVoices];

            // Try to find preferred voice
            for (let name of preferredNames) {
                const voice = voices.find(v => v.name.includes(name));
                if (voice) {
                    utterance.voice = voice;
                    console.log('✓ Selected voice:', voice.name);
                    return;
                }
            }

            // Fallback: Find any English voice
            const enVoice = voices.find(v => 
                v.lang.startsWith('en-') || 
                v.lang === 'en_US' || 
                v.lang === 'en'
            );
            
            if (enVoice) {
                utterance.voice = enVoice;
                console.log('✓ Selected fallback voice:', enVoice.name);
            } else {
                console.warn('⚠️ No English voice found, using default');
            }
        }

        function hangupCall() {
            stopAllActivity = true;
            if (currentTypingTimeout) {
                clearTimeout(currentTypingTimeout);
                currentTypingTimeout = null;
            }

            if (socket) {
                socket.emit('end-conversation');
                socket.disconnect();
            }

            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }

            speechSynthesis.cancel();
            resetUI();
            addStatus('Call ended. Thank you!');
        }

        function resetUI() {
            isCallActive = false;
            isRecording = false;
            currentUserMessageElement = null;
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('hangupBtn').style.display = 'none';
            document.getElementById('sessionInfo').style.display = 'none';
        }

        function addStatus(text, isListening = false) {
            const chatContainer = document.getElementById('chatContainer');
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status-indicator' + (isListening ? ' listening' : '');
            statusDiv.textContent = text;
            chatContainer.appendChild(statusDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateSessionInfo(data) {
            const infoDiv = document.getElementById('sessionInfo');
            const detailsDiv = document.getElementById('sessionDetails');

            let html = '';
            if (data.userName) html += `Name: ${data.userName}<br>`;
            if (data.serviceType) html += `Service: ${data.serviceType}<br>`;
            if (data.proposedDate) html += `Date: ${data.proposedDate}<br>`;
            if (data.proposedTime) html += `Time: ${data.proposedTime}<br>`;
            if (data.phone) html += `Phone: ${data.phone}<br>`;
            if (data.vehicleInfo) html += `Vehicle: ${data.vehicleInfo}<br>`;

            if (html) {
                detailsDiv.innerHTML = html;
                infoDiv.style.display = 'block';

                if (data.confirmed) {
                    infoDiv.className = 'session-info confirmed';
                    const strongTag = infoDiv.querySelector('strong');
                    if (strongTag) strongTag.textContent = '✅ Appointment Confirmed:';
                }
            }
        }
    </script>
</body>

</html>
